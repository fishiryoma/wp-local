<!doctype html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <title>テスのブログヘルパー</title>
        <link rel="icon" type="image/png" href="/static/icon.png" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=Rampart+One&display=swap"
        />
        <link rel="stylesheet" href="/static/style.css" />
    </head>
    <body>
        <div class="layout">
            <aside class="sidebar">
                <div class="sidebar-brand">
                    <img src="/static/icon.png" alt="" class="sidebar-icon" />
                    <h1>テスのブログヘルパー</h1>
                </div>
                <div class="tabs">
                    <button class="tab-btn active" data-tab="grammar">
                        日文校對
                    </button>
                    <button class="tab-btn" data-tab="factcheck">
                        事實查核
                    </button>
                    <button class="tab-btn" data-tab="manage">草稿管理</button>
                </div>
                {% if not has_api_key %}
                <div class="warn-box">
                    ⚠️ 尚未設定
                    GEMINI_API_KEY，日文校對功能無法使用。請到專案根目錄的
                    <code>.env</code> 新增後重新啟動。 （事實查核不需要這組
                    Key）
                </div>
                {% endif %}
                <div id="post-list-wrap">
                    <input
                        id="search"
                        type="text"
                        placeholder="搜尋文章標題..."
                    />
                    <label class="draft-first-toggle">
                        <input id="draft-first" type="checkbox" checked />
                        優先顯示已有草稿文章
                    </label>
                    <div id="post-list" class="post-list"></div>
                </div>
            </aside>

            <main class="content">
                <div id="empty-state" class="empty-state">
                    從左側選一篇文章開始
                </div>

                <div id="editor" class="editor" style="display: none">
                    <div class="editor-header">
                        <h2 id="post-title"></h2>
                        <div class="editor-actions">
                            <button id="btn-prepare" class="btn btn-primary">
                                開始 / 重新 AI 校對
                            </button>
                            <span id="summary" class="summary"></span>
                            <button
                                id="btn-apply"
                                class="btn btn-danger"
                                disabled
                            >
                                套用並覆蓋原文
                            </button>
                        </div>
                    </div>
                    <div
                        id="stale-banner"
                        class="stale-banner"
                        style="display: none"
                    ></div>
                    <div id="warnings" class="warnings"></div>
                    <div
                        id="applied-banner"
                        class="applied-banner"
                        style="display: none"
                    ></div>
                    <div
                        id="title-panel"
                        class="title-panel"
                        style="display: none"
                    ></div>
                    <div id="review-content" class="review-content"></div>
                </div>

                <div id="manage-view" class="manage-view" style="display: none">
                    <h2>草稿管理</h2>
                    <p class="hint">
                        列出目前所有校對／查核的草稿（不分種類），可以直接刪除不需要的。
                        只會刪除本機的審核進度檔案，不會動到 WordPress
                        資料庫裡的文章本身。
                    </p>
                    <table class="manage-table">
                        <thead>
                            <tr>
                                <th>文章</th>
                                <th>種類</th>
                                <th>狀態</th>
                                <th>時間</th>
                                <th>變更／筆記</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="manage-tbody"></tbody>
                    </table>
                </div>
            </main>
        </div>

        <div id="redo-modal" class="modal" style="display: none">
            <div class="modal-box">
                <h3>要求重新調整</h3>
                <p class="modal-hint">
                    告訴 AI
                    這段哪裡不對，例如：「這太書面語了，我平常不會這樣講」、「這個不是錯字，請保留原文」。
                </p>
                <textarea
                    id="redo-instruction"
                    rows="3"
                    placeholder="輸入你的意見..."
                ></textarea>
                <div class="modal-actions">
                    <button id="redo-cancel" class="btn">取消</button>
                    <button id="redo-submit" class="btn btn-primary">
                        送出
                    </button>
                </div>
            </div>
        </div>

        <div id="app-modal" class="modal" style="display: none">
            <div class="modal-box">
                <p id="app-modal-message" class="app-modal-message"></p>
                <div class="modal-actions">
                    <button id="app-modal-cancel" class="btn">取消</button>
                    <button id="app-modal-ok" class="btn btn-primary">
                        確定
                    </button>
                </div>
            </div>
        </div>

        <script src="/static/app.js"></script>
    </body>
</html>
